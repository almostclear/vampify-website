<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>VAMPIFY — QR Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Urbanist:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* VAMPIFY QR business card — 85x55mm, double-sided.
         Best quality: run ./export-pdf.sh card  then print card.pdf at 100%.
         Print-safe: solid colors, vector borders, vector QR. No gradients. */

      :root {
        --paper: #f7f7f2;
        --wash: #eaf3ea;
        --ink: #121212;
        --mist: #4a4a44;
        --neon-dim: #3d9a3d;
        --line: rgba(18, 18, 18, 0.22);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        background: #2a2a2a;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 1.5rem;
        padding: 2rem;
        font-family: "Urbanist", system-ui, sans-serif;
        color: var(--ink);
      }

      /* UK business card: 85mm x 55mm landscape */
      .card {
        width: 85mm;
        height: 55mm;
        position: relative;
        overflow: hidden;
        background: var(--paper);
        flex: none;
      }

      .frame {
        position: absolute;
        inset: 3.5mm;
        border: 1px solid var(--line);
        pointer-events: none;
      }

      .inner {
        position: absolute;
        inset: 7mm;
        display: flex;
        flex-direction: column;
      }

      .label {
        font-size: 6pt;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--neon-dim);
        font-weight: 600;
      }

      /* ---------- front (identity) ---------- */

      .logo {
        width: 44mm;
        height: 13mm;
        object-fit: cover; /* crop square canvas to wordmark strip */
        object-position: center;
        display: block;
        margin-bottom: 3mm;
      }

      .tagline {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 11pt;
        color: var(--mist);
        line-height: 1.25;
        max-width: 60mm;
      }

      .front-foot {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 1mm;
      }

      .front-foot .email {
        font-size: 9.5pt;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-decoration: none;
      }

      .front-foot .site {
        font-size: 6.5pt;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mist);
      }

      /* ---------- back (QR) ---------- */

      .back .inner {
        flex-direction: row;
        align-items: center;
        gap: 6mm;
      }

      .qr {
        width: 30mm;
        height: 30mm;
        flex: none;
      }

      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .back-copy {
        display: flex;
        flex-direction: column;
        gap: 2mm;
      }

      .back-copy h2 {
        font-size: 13pt;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      .back-copy p {
        font-size: 8pt;
        color: var(--mist);
        line-height: 1.4;
        max-width: 36mm;
      }

      .back-copy .site {
        margin-top: 1mm;
        font-size: 6.5pt;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mist);
      }

      /* ---------- print ---------- */

      @page {
        size: 85mm 55mm;
        margin: 0;
      }

      @media print {
        body {
          background: none;
          display: block;
          padding: 0;
          gap: 0;
        }

        .card {
          page-break-after: always;
          break-after: page;
        }

        .card:last-child {
          page-break-after: auto;
          break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <!-- FRONT — identity -->
    <section class="card front">
      <div class="frame"></div>
      <div class="inner">
        <img class="logo" src="assets/vampify-transparent.png" alt="VAMPIFY" />
        <p class="tagline">
          Websites, refreshed for local businesses.
        </p>
        <div class="front-foot">
          <a class="email" href="mailto:discovery@vampify.co.uk"
            >discovery@vampify.co.uk</a
          >
          <span class="site">vampify.co.uk · est. 2026</span>
        </div>
      </div>
    </section>

    <!-- BACK — QR -->
    <section class="card back">
      <div class="frame"></div>
      <div class="inner">
        <div class="qr">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" shape-rendering="crispEdges"><path fill="#f7f7f2" d="M0 0h33v33H0z"/><path stroke="#121212" d="M4 4.5h7m3 0h2m1 0h1m2 0h1m1 0h7M4 5.5h1m5 0h1m2 0h2m2 0h4m1 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h2m4 0h1m3 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h2m2 0h2m1 0h1m2 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h1m2 0h1m1 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h3m2 0h3m2 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h1m7 0h1M4 12.5h1m1 0h5m3 0h5m3 0h5M4 13.5h3m1 0h2m1 0h2m5 0h1m4 0h1m3 0h1M5 14.5h1m1 0h2m1 0h3m1 0h3m1 0h3m1 0h1m1 0h2m1 0h2M5 15.5h1m1 0h3m2 0h2m4 0h2m1 0h3m4 0h1M6 16.5h1m2 0h2m1 0h1m2 0h1m1 0h2m1 0h5m1 0h3M4 17.5h1m6 0h1m1 0h2m1 0h2m2 0h1m2 0h1m1 0h1m1 0h1M4 18.5h1m1 0h1m1 0h1m1 0h2m2 0h1m2 0h1m1 0h1m1 0h1m1 0h3m1 0h2M4 19.5h1m3 0h2m1 0h1m1 0h1m2 0h1m1 0h1m1 0h5m3 0h1M4 20.5h1m1 0h1m1 0h1m1 0h3m3 0h2m1 0h6m1 0h1M12 21.5h2m3 0h1m1 0h2m3 0h2M4 22.5h7m2 0h6m1 0h1m1 0h1m1 0h1m1 0h3M4 23.5h1m5 0h1m1 0h2m1 0h1m2 0h1m1 0h1m3 0h2m2 0h1M4 24.5h1m1 0h3m1 0h1m1 0h1m1 0h11m1 0h1M4 25.5h1m1 0h3m1 0h1m1 0h1m3 0h2m3 0h2m1 0h5M4 26.5h1m1 0h3m1 0h1m1 0h1m1 0h1m4 0h3m3 0h2m1 0h1M4 27.5h1m5 0h1m3 0h1m1 0h1m2 0h2m1 0h4m2 0h1M4 28.5h7m1 0h2m1 0h4m3 0h7"/></svg>
        </div>
        <div class="back-copy">
          <p class="label">Scan me</p>
          <h2>See what I'd change.</h2>
          <p>A 30-second look at how I'd refresh your site — free to ask.</p>
          <span class="site">vampify.co.uk/hi</span>
        </div>
      </div>
    </section>
  </body>
</html>
