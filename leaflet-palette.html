<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>VAMPIFY — A5 Leaflet</title>
    <style>
      /* VAMPIFY leaflet — A5 double-sided, printed straight from this file.
         Print: File > Print > A5, no margins, double-sided (flip on long edge),
         and enable "Background graphics". */

      :root {
        --paper: #f7f7f2;
        --panel: #edede6;
        --wash: #e6f0e6;
        --ink: #121212;
        --mist: #4a4a44;
        --neon: #7fff7f;
        --neon-dim: #3d9a3d;
        --line: rgba(18, 18, 18, 0.22);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Screen preview: pages floating on a dark backdrop */
      body {
        background: #2a2a2a;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 2rem;
        padding: 2rem;
        font-family: "Urbanist", system-ui, sans-serif;
      }

      /* A5 portrait: 148mm x 210mm */
      .page {
        width: 148mm;
        height: 210mm;
        position: relative;
        overflow: hidden;
        background: var(--paper);
        border: 4px solid var(--ink); /* the ink edge from the screenshot */
        flex: none;
      }

      /* Soft green glow rising from the bottom, as in the reference */
      .page-front {
        background:
          radial-gradient(
            ellipse 130% 55% at 50% 108%,
            rgba(127, 255, 127, 0.45),
            rgba(127, 255, 127, 0.18) 45%,
            transparent 75%
          ),
          var(--paper);
      }

      /* Back: same language, glow from the top so the fold feels mirrored */
      .page-back {
        background:
          radial-gradient(
            ellipse 130% 55% at 50% -8%,
            rgba(127, 255, 127, 0.45),
            rgba(127, 255, 127, 0.18) 45%,
            transparent 75%
          ),
          var(--paper);
      }

      /* Inner hairline frame — the blueprint line from the site */
      .inner-frame {
        position: absolute;
        inset: 6mm;
        border: 1px solid var(--line);
        pointer-events: none;
      }

      /* Content area: everything text/layout goes in here next */
      .content {
        position: absolute;
        inset: 12mm;
        display: flex;
        flex-direction: column;
      }

      /* Print rules */
      @page {
        size: A5 portrait;
        margin: 0;
      }

      @media print {
        body {
          background: none;
          display: block;
          padding: 0;
          gap: 0;
        }

        .page {
          border-width: 4px; /* keep the ink edge on paper */
          page-break-after: always;
          break-after: page;
        }

        .page:last-child {
          page-break-after: auto;
          break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <!-- FRONT — glow rises from the bottom -->
    <section class="page page-front">
      <div class="inner-frame"></div>
      <div class="content">
        <!-- front content goes here -->
      </div>
    </section>

    <!-- BACK — glow falls from the top -->
    <section class="page page-back">
      <div class="inner-frame"></div>
      <div class="content">
        <!-- back content goes here -->
      </div>
    </section>
  </body>
</html>
