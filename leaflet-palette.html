<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Palette</title>
    <style>
      /* VAMPIFY brand tokens — light mode inversion for print */
      :root {
        --paper: #f7f7f2; /* bone, now the canvas */
        --panel: #edede6;
        --wash: #e6f0e6; /* light green wash */
        --ink: #121212; /* now the accent/shape color */
        --mist: #4a4a44; /* mid tone on light */
        --neon: #7fff7f;
        --neon-dim: #3d9a3d; /* better contrast green for print */
        --line: rgba(18, 18, 18, 0.22);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--paper);
      }

      section {
        min-height: 100vh;
        position: relative;
      }

      /* 1. Hero canvas — light paper with soft green radiance */
      .glow {
        background:
          radial-gradient(
            ellipse 70% 55% at 12% 88%,
            rgba(127, 255, 127, 0.28),
            transparent 60%
          ),
          radial-gradient(
            ellipse 45% 40% at 92% 18%,
            rgba(127, 255, 127, 0.12),
            transparent 55%
          ),
          var(--paper);
      }

      .frame {
        position: absolute;
        inset: 1.25rem;
        border: 1px solid var(--line);
        pointer-events: none;
      }

      .dot {
        position: absolute;
        bottom: 18%;
        left: 8%;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 50%;
        background: var(--neon-dim);
      }

      .bar {
        position: absolute;
        bottom: 10%;
        left: 8%;
        width: 14rem;
        height: 3.25rem;
        background: var(--ink);
      }

      .rule-v {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }

      /* 2. Swatch strip — flat light-mode brand colors edge to edge */
      .swatches {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr 2fr;
        min-height: 40vh;
      }

      .swatches > div {
        border-right: 1px solid var(--line);
      }

      .c-paper { background: #f7f7f2; }
      .c-panel { background: #edede6; }
      .c-wash { background: #e6f0e6; }
      .c-neon { background: #7fff7f; }
      .c-neon-dim { background: #3d9a3d; }
      .c-ink { background: #121212; }

      /* 3. Panel grid — bordered layout rhythm on light */
      .grid3 {
        min-height: 60vh;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .grid3 > div {
        border-right: 1px solid var(--line);
        position: relative;
      }

      .grid3 > div:last-child {
        border-right: none;
      }

      .accent-left {
        box-shadow: inset 3px 0 0 0 var(--neon-dim);
      }

      .tick {
        position: absolute;
        top: 2.5rem;
        left: 2.5rem;
        width: 2.5rem;
        height: 1px;
        background: var(--neon-dim);
      }

      .p-paper { background: #f7f7f2; }
      .p-panel { background: #edede6; }
      .p-wash { background: #e6f0e6; }

      /* 4. Footer wash — green rising glow on light paper */
      .contact {
        min-height: 70vh;
        background:
          radial-gradient(
            ellipse 60% 70% at 50% 100%,
            rgba(127, 255, 127, 0.3),
            transparent 55%
          ),
          #edf4ed;
      }

      .center-rule {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translateX(-50%);
        width: 4rem;
        height: 1px;
        background: var(--neon-dim);
      }
    </style>
  </head>
  <body>
    <!-- Crop 1: light hero — paper + soft green glow + blueprint frame -->
    <section class="glow">
      <div class="frame"></div>
      <div class="rule-v" style="left: 33%"></div>
      <div class="rule-v" style="left: 66%"></div>
      <div class="dot"></div>
      <div class="bar"></div>
    </section>

    <!-- Crop 2: flat swatch strip (paper / panel / wash / neon / print green / ink) -->
    <section class="swatches">
      <div class="c-paper"></div>
      <div class="c-panel"></div>
      <div class="c-wash"></div>
      <div class="c-neon"></div>
      <div class="c-neon-dim"></div>
      <div class="c-ink"></div>
    </section>

    <!-- Crop 3: bordered panel rhythm with green accent column -->
    <section class="grid3">
      <div class="p-paper"><span class="tick"></span></div>
      <div class="p-wash accent-left"></div>
      <div class="p-panel"><span class="tick"></span></div>
    </section>

    <!-- Crop 4: footer wash — green glow rising from the bottom edge -->
    <section class="contact">
      <div class="frame"></div>
      <div class="center-rule"></div>
    </section>
  </body>
</html>
